[package]
name = "ducky-pad-bridge"
version = "0.2.1"
edition = "2021"
description = "herdr plugin that drives a duckyPad: 14 NeoPixel keys per herdr agent, colored by state; the final key is an F9 shortcut. Agent key assignment is stable per agent."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
libc = "0.2"
dirs = "5"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
parking_lot = "0.12"

[profile.release]
opt-level = 2
