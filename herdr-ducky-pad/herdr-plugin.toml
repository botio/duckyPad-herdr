# herdr plugin: duckyPad bridge
#
# A duckyPad (STM32F072 macropad) is exposed as a custom-HID device
# (VID 0x483 / PID 0xd11c). This plugin's daemon opens that device and:
#   * lights one of the first 14 NeoPixel keys per herdr agent, colored by
#     the agent's state,
#   * reserves the final key as a local F9 shortcut (white at rest, red while
#     pressed),
#   * shows a short list of the mapped agents on the pad's OLED,
#   * on an agent-key press, focuses that agent's pane in herdr.
#
# The daemon is a long-lived process installed as a user service: a systemd
# user unit on Linux or a launchd LaunchAgent on macOS. It is not a herdr
# [[startup]] hook — those hooks are one-shot (they must exit), while this
# daemon polls herdr continuously. Enable it with `./install.sh`.
# Set DUCKY_DRY_RUN=1 to run without the physical pad (logs HID writes).

id = "ducky.pad-bridge"
name = "duckyPad Herdr Bridge"
version = "0.2.1"
min_herdr_version = "0.8.0"
description = "Light a duckyPad from herdr agent state: 14 agents -> 14 keys, key color = state; key 15 is F9 (white at rest, red while pressed). Agent assignment is stable by pane_id."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

# There is deliberately no [[startup]] hook: the daemon is supervised by the
# systemd user service (see above). Herdr's one-shot startup hook would either
# race the service's instance or be expected to exit, which a daemon never does.
