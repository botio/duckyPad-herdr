# herdr plugin: duckyPad bridge
#
# A duckyPad (STM32F072 macropad) is exposed as a custom-HID device
# (VID 0x483 / PID 0xd11c). This plugin's daemon opens that device and:
#   * lights one NeoPixel key per herdr agent, colored by the agent's state,
#   * shows a short list of the mapped agents on the pad's OLED,
#   * on a key press, focuses that agent's pane in herdr.
#
# The daemon is a long-lived process run by a systemd user service
# (~/.config/systemd/user/ducky-pad-bridge.service), not by a herdr [[startup]]
# hook -- herdr's startup hooks are one-shot (they must exit), while this daemon
# polls herdr continuously. Enable the service with:
#   systemctl --user enable --now ducky-pad-bridge
# Set DUCKY_DRY_RUN=1 to run without the physical pad (logs HID writes).

id = "ducky.pad-bridge"
name = "duckyPad Herdr Bridge"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Light a duckyPad from herdr agent state: N agents -> N keys, key color = state, press a key to focus that agent. Key assignment is stable per agent (pane_id) for as long as it stays in the list."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

# There is deliberately no [[startup]] hook: the daemon is supervised by the
# systemd user service (see above). Herdr's one-shot startup hook would either
# race the service's instance or be expected to exit, which a daemon never does.
